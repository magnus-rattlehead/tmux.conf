set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0
set -g history-limit 50000
set -g display-time 2000
set -g status-interval 3
set -g focus-events on
set -g allow-passthrough on

set -g mouse on
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display "Tmux Configuration Reloaded!"

set -s set-clipboard on
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @catppuccin_flavor 'cyberdream' # latte, frappe, macchiato or mocha
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'codex "codex->codex resume --last"'
# Set before TPM so tmux-continuum can prepend its autosave hook.
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}%H:%M %d-%b-%y"
run '~/.tmux/plugins/tpm/tpm'
run '~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# Show right-click menu items without a surrounding border.
set -gF menu-style "fg=#{@thm_fg},bg=#{@thm_bg}"
set -g menu-border-lines none

# Keep tmux's default pane context menu, but omit its pane index/ID title.
bind-key -T root MouseDown3Pane if-shell -F -t = \
  "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" \
  { select-pane -t = ; send-keys -M } \
  { display-menu -T "" -t = -x M -y M \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } \
    '' \
    "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward "#{q:mouse_word}" } \
    "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } \
    "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } \
    "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } \
    '' \
    "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } \
    "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } \
    '' \
    "Horizontal Split" h { split-window -h } \
    "Vertical Split" v { split-window -v } \
    '' \
    "#{?#{>:#{window_panes},1},,-}Swap Up" u { swap-pane -U } \
    "#{?#{>:#{window_panes},1},,-}Swap Down" d { swap-pane -D } \
    "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } \
    '' \
    Kill X { kill-pane } \
    Respawn R { respawn-pane -k } \
    "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
    "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } }

# Make the status bar background transparent
set -g status-style bg=default

# Make window list backgrounds transparent
set -w -g window-status-style bg=default
set -w -g window-status-current-style bg=default

# Make pane borders transparent (optional, but looks cleaner)
set -g pane-border-style bg=default
set -g pane-active-border-style bg=default
